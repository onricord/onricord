<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Onricord</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 430px 폰 프레임. 스플래시 → 환영(가입/로그인) → 홈(서버 레일 + 채널 목록 + 내 정보 바). 검정 바탕에 흰색 포인트 */
  :root {
    --bg: #000000;
    --rail: #050505;
    --panel: #0f0f0f;
    --raised: #1b1b1b;
    --sel: #262626;
    --line: rgba(255, 255, 255, .12);
    --text: #ffffff;
    --muted: #a9a9a9;
    --accent: #ffffff;
    --on-accent: #000000;
    --ok: #8fe3a8;
    --err: #ff9b9b;
    --font-display: 'Bricolage Grotesque', 'Noto Sans KR', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.fill { fill: currentColor; stroke: none; }

  .app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100%;
    margin-inline: auto;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }
  @media (min-width: 520px) {
    body { display: grid; place-items: center; }
    .app { height: min(100%, 900px); border-radius: 36px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 30px 80px rgba(0, 0, 0, .6); }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: opacity .6s ease, visibility .6s;
  }

  /* 1. 스플래시 */
  .splash { z-index: 3; background: var(--bg); align-items: center; justify-content: center; cursor: pointer; }
  .splash .mark { width: 148px; height: 86px; color: var(--text); animation: pop .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  .app.is-welcome .splash, .app.is-home .splash { opacity: 0; visibility: hidden; }

  /* 2. 환영 화면 */
  .welcome {
    z-index: 1;
    opacity: 0;
    visibility: hidden;
    background:
      radial-gradient(110% 50% at 85% 0%, rgba(255, 255, 255, .09), transparent 62%),
      linear-gradient(180deg, #000000 0%, #050505 60%, #0e0e0e 100%);
  }
  .app.is-welcome .welcome { opacity: 1; visibility: visible; }

  .orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, .22);
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 66%);
    filter: blur(1.5px);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .o1 { width: 150px; height: 150px; top: 7%; right: -34px; }
  .o2 { width: 66px; height: 66px; top: 23%; left: 11%; animation-delay: -4s; }
  .o3 { width: 230px; height: 230px; bottom: 20%; left: -100px; border-color: rgba(255, 255, 255, .3); animation-delay: -8s; }
  .o4 { width: 88px; height: 88px; bottom: 9%; right: 9%; animation-delay: -2s; }
  @keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(10px, -18px, 0); } }

  .dust {
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .7);
    box-shadow:
      52px 96px 0 rgba(255,255,255,.55), 318px 70px 0 rgba(255,255,255,.8), 176px 160px 0 rgba(255,255,255,.4),
      388px 244px 0 rgba(255,255,255,.6), 34px 300px 0 rgba(255,255,255,.5), 244px 352px 0 rgba(255,255,255,.35),
      120px 436px 0 rgba(255,255,255,.65), 360px 500px 0 rgba(255,255,255,.45), 70px 590px 0 rgba(255,255,255,.55),
      290px 640px 0 rgba(255,255,255,.7), 200px 724px 0 rgba(255,255,255,.4), 396px 780px 0 rgba(255,255,255,.6),
      24px 840px 0 rgba(255,255,255,.5), 150px 880px 0 rgba(255,255,255,.35);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }

  .welcome-inner {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-block: 32px 28px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .hero { margin-block: auto; display: flex; flex-direction: column; gap: 18px; }
  .hero .mark { width: 96px; height: 56px; color: var(--accent); }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7.4vw, 2.1rem);
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -.01em;
    word-break: keep-all;
    text-wrap: balance;
  }
  .wm { font-family: var(--font-display); font-weight: 800; letter-spacing: -.035em; }
  .lead { margin: 0; max-width: 30ch; color: var(--muted); word-break: keep-all; }

  .actions { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    appearance: none;
    height: 56px;
    border-radius: 999px;
    border: 1px solid transparent;
    font: 700 1rem/1 var(--font-body);
    cursor: pointer;
    transition: transform .15s ease, background-color .2s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: #e4e4e4; }
  .btn-ghost { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .24); color: var(--text); }
  .btn-ghost:hover { background: rgba(255, 255, 255, .16); }

  .app.is-welcome .hero > *, .app.is-welcome .actions { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  .app.is-welcome .hero > :nth-child(2) { animation-delay: .08s; }
  .app.is-welcome .hero > :nth-child(3) { animation-delay: .16s; }
  .app.is-welcome .actions { animation-delay: .26s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* 3. 홈 */
  .home, .chat {
    --av: hsl(210 68% 44%);
    --rail: #f0f0f3; --panel: #fbfbfb; --raised: #e8e8ec; --sel: #e1e1e5;
    --line: rgba(0, 0, 0, .1); --text: #17171a; --muted: #67676e; --accent: #17171a;
    --hover: rgba(0, 0, 0, .05); --bar: #ffffff;
    color: var(--text); color-scheme: light;
  }
  .home { z-index: 1; flex-direction: row; background: var(--rail); opacity: 0; visibility: hidden; }
  .app.is-home .home { opacity: 1; visibility: visible; }

  .rail {
    flex: none;
    width: 76px;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .rail-btn, .server-ico {
    width: 54px; height: 54px;
    border-radius: 18px;
    display: grid; place-items: center;
    border: 0;
    background: var(--raised);
    color: var(--text);
  }
  .rail-btn { cursor: pointer; }
  .rail-btn:focus-visible, .server-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .rail-sep { width: 34px; height: 1px; background: var(--line); }
  .server-btn { position: relative; appearance: none; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 18px; }
  .server-btn::before {
    content: ""; position: absolute; left: -11px; top: 9px; width: 4px; height: 36px;
    border-radius: 0 4px 4px 0; background: var(--accent);
  }
  .server-ico { display: block; object-fit: cover; }

  .panel {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-top-left-radius: 28px;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    padding-top: 16px;
  }
  .panel-head { display: flex; flex-direction: column; gap: 12px; padding-inline: 14px 12px; padding-bottom: 14px; }
  .title-btn {
    appearance: none; background: none; border: 0; padding: 4px 2px; cursor: default;
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-weight: 700; font-size: 1.15rem; text-align: left;
  }
  .title-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-btn svg { width: 16px; height: 16px; color: var(--muted); }
  .tools { display: flex; gap: 8px; }
  .tool {
    appearance: none; height: 44px; border-radius: 14px; cursor: pointer;
    background: var(--raised); border: 1px solid var(--line); color: var(--text);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tool.grow { flex: 1; min-width: 0; font-weight: 500; font-size: .9375rem; }
  .tool.sq { width: 44px; flex: none; }
  .tool:focus-visible, .row-btn:focus-visible, .section-head:focus-visible, .channel:focus-visible, .who:focus-visible, .bell:focus-visible, .menu-item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); }
  .row-btn {
    appearance: none; background: none; border: 0; cursor: pointer; width: 100%;
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: var(--muted);
    border-bottom: 1px solid var(--line); text-align: left; font-size: 1rem;
  }
  .section-head {
    appearance: none; background: none; border: 0; cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 14px 16px 6px;
    color: var(--muted); font-size: .875rem; font-weight: 500;
  }
  .section-head svg { width: 14px; height: 14px; transition: transform .2s ease; }
  .section-head[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .channel {
    appearance: none; border: 0; cursor: pointer; background: transparent;
    display: flex; align-items: center; gap: 12px;
    width: calc(100% - 16px); margin-inline: 8px; height: 46px; padding: 0 10px;
    border-radius: 12px; color: var(--muted); font-size: 1rem; font-weight: 500; text-align: left;
  }
  .channel:hover { background: var(--hover); }
  .channel.active { background: var(--sel); color: var(--text); }
  .channel svg { color: inherit; }

  .userbar {
    margin: 10px 12px; margin-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding: 8px 12px 8px 8px;
    display: flex; align-items: center; gap: 4px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
  }
  .who {
    appearance: none; background: none; border: 0; cursor: pointer; flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 12px; padding: 0; text-align: left; border-radius: 18px;
  }
  .avatar {
    position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: var(--av); display: grid; place-items: center; color: #fff;
  }
  .avatar svg { width: 30px; height: 18px; fill: none; stroke: currentColor; }
  .dot {
    position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%;
    background: #3fae5f; border: 3px solid var(--bar);
  }
  .who-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .who-name { display: flex; align-items: center; gap: 4px; font-weight: 700; }
  .who-name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-name svg { width: 16px; height: 16px; flex: none; }
  .who-state { font-size: .75rem; color: var(--muted); }
  .bell { appearance: none; background: none; border: 0; padding: 8px; border-radius: 12px; cursor: pointer; color: var(--muted); }

  .menu {
    position: absolute; left: 12px; right: 12px; z-index: 3;
    bottom: calc(14px + 66px + 18px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); border: 1px solid var(--line); border-radius: 18px; padding: 6px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
  }
  .menu-item {
    appearance: none; width: 100%; height: 46px; border: 0; background: none; cursor: pointer;
    border-radius: 12px; padding: 0 12px; text-align: left; font-size: 1rem; font-weight: 500;
  }
  .menu-item:hover { background: var(--hover); }

  /* 4. 채팅 채널 */
  .chat {
    z-index: 2; background: var(--panel);
    opacity: 0; visibility: hidden; transform: translateX(18px);
    transition: opacity .3s ease, transform .3s ease, visibility .3s;
  }
  .app.is-chat .chat { opacity: 1; visibility: visible; transform: none; }
  .chat-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 10px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .icon-btn {
    appearance: none; border: 0; background: none; cursor: pointer; flex: none;
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn:focus-visible, .cbtn:focus-visible, .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chat-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .chat-title b { display: flex; align-items: center; gap: 6px; font-size: 1.1rem; font-weight: 700; }
  .chat-title b svg:first-child { width: 20px; height: 20px; }
  .chat-title b svg:last-child { width: 14px; height: 14px; color: var(--muted); transform: rotate(-90deg); }
  .chat-title small { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
  .online-dot { width: 9px; height: 9px; border-radius: 50%; background: #2f7a4a; }
  .feed { flex: 1; min-height: 0; overflow-y: auto; }
  .feed-inner { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; }
  .intro { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 18px; }
  .intro-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; }
  .intro-ico svg { width: 34px; height: 34px; }
  .intro h2 { margin: 10px 0 0; font-size: 1.3rem; font-weight: 500; word-break: keep-all; }
  .intro p { margin: 0; font-size: .9rem; color: var(--text); word-break: keep-all; }
  .msg { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 8px 16px; }
  .msg-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .msg-meta b { font-weight: 700; }
  .msg-meta time { font-size: .75rem; color: var(--muted); }
  .msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .composer {
    flex: none; display: flex; align-items: center; gap: 2px;
    margin: 6px 12px; margin-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding: 5px 10px; min-height: 52px; border-radius: 26px;
    background: var(--raised); border: 1px solid var(--line);
  }
  .composer:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .composer input {
    flex: 1; min-width: 0; height: 40px; padding: 0 8px; border: 0; background: transparent;
    color: var(--text); font: 400 1rem var(--font-body); outline: none;
  }
  .composer input::placeholder { color: var(--muted); }
  .cbtn {
    appearance: none; border: 0; background: none; cursor: pointer; flex: none;
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted);
  }
  .send {
    appearance: none; border: 0; cursor: pointer; flex: none; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #ffffff; display: grid; place-items: center;
  }

  /* 가입·로그인 시트 */
  .backdrop {
    position: absolute; inset: 0; z-index: 4;
    background: rgba(0, 0, 0, .65);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s .3s;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    max-height: 94%; overflow-y: auto;
    background: #0d0d0d;
    border-top: 1px solid rgba(255, 255, 255, .16);
    border-radius: 26px 26px 0 0;
    padding-top: 22px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .38s cubic-bezier(.2, .8, .2, 1), visibility 0s .38s;
  }
  .app.sheet-open .backdrop { opacity: 1; visibility: visible; transition-delay: 0s; }
  .app.sheet-open .sheet { transform: translateY(0); visibility: visible; transition-delay: 0s; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .sheet h2 { margin: 0; font-size: 1.25rem; }
  .hint { margin: 0 0 14px; font-size: .875rem; color: var(--muted); word-break: keep-all; }
  .close {
    appearance: none; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255, 255, 255, .08); border: 0; color: var(--text);
    font-size: 1.25rem; line-height: 1; cursor: pointer;
  }
  .close:focus-visible, .switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: .8125rem; color: var(--muted); font-weight: 500; }
  .field input {
    height: 48px; width: 100%; padding: 0 14px;
    border-radius: 14px; border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(255, 255, 255, .06); color: var(--text);
    font: 400 1rem var(--font-body);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .note { min-height: 1.4em; margin: 0; font-size: .875rem; color: var(--muted); word-break: keep-all; }
  .note.err { color: var(--err); }
  .note.ok { color: var(--ok); }
  .switch {
    appearance: none; background: none; border: 0; padding: 6px 0;
    color: var(--muted); font: 500 .9rem var(--font-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    align-self: center;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="onri-mark" viewBox="-2 10 124 72">
    <path d="M32 16 H88 C100 16 108 26 112 44 L116 62 C118 72 112 78 104 78 C96 78 92 72 86 66 H34 C28 72 24 78 16 78 C8 78 2 72 4 62 L8 44 C12 26 20 16 32 16 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
    <path d="M36 33 V55 M25 44 H47" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <circle cx="83" cy="38" r="5.5" fill="currentColor"/>
    <circle cx="97" cy="50" r="5.5" fill="currentColor"/>
  </symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<main class="app" id="app">
  <section class="screen splash" id="splash" aria-label="Onricord 시작 화면">
    <svg class="mark" role="img" aria-label="Onricord 로고"><use href="#onri-mark"/></svg>
  </section>

  <section class="screen welcome" aria-label="환영 화면">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>
    <i class="dust"></i>
    <div class="welcome-inner">
      <div class="hero">
        <svg class="mark" aria-hidden="true"><use href="#onri-mark"/></svg>
        <h1><span class="wm">onricord</span>에 오신 걸 환영해요</h1>
        <p class="lead">모여서 이야기하고, 같이 놀고, 가볍게 수다 떨어요. 아래 버튼으로 시작해요.</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button" data-open="signup">가입하기</button>
        <button class="btn btn-ghost" type="button" data-open="login">로그인</button>
      </div>
    </div>
  </section>

  <section class="screen home" id="home" aria-label="홈">

          <svg class="i fill" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="screen chat" id="chat" aria-label="겜할사람 채널">
    <header class="chat-head">
      <button class="icon-btn" id="chat-back" type="button" aria-label="뒤로">
        <svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="chat-title">
        <b>
          <svg class="i" viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></svg>
          겜할사람
          <svg class="i" viewBox="0 0 24 24"><use href="#ic-chevron"/></svg>
        </b>
        <small><i class="online-dot"></i>2명 온라인</small>
      </div>
      <button class="icon-btn" type="button" aria-label="검색">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
      </button>
    </header>

    <div class="feed" id="feed">
      <div class="feed-inner">
        <div class="intro">
          <div class="intro-ico">
            <svg class="i" viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></svg>
          </div>
          <h2>오시온님의 서버에 오신 것을 환영합니다!</h2>
          <p>직접 만드신 새로운 서버에 오신 것을 환영해요.</p>
        </div>
        <div id="messages"></div>
      </div>
    </div>

    <div class="composer">
      <button class="cbtn" type="button" aria-label="첨부">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="msg" type="text" placeholder="#겜할사람에 메시지 보내기" autocomplete="off" enterkeyhint="send" maxlength="2000" aria-label="메시지">
      <button class="cbtn" type="button" aria-label="선물">
        <svg class="i fill" viewBox="0 0 24 24"><path d="M4 8h16v4H4zM5 13h14v7H5zM12 8C11 4.5 7 4.5 7 6.8 7 8 9 8 12 8zM12 8c1-3.5 5-3.5 5-1.2C17 8 15 8 12 8z"/></svg>
      </button>
      <button class="cbtn" type="button" aria-label="이모지">
        <svg class="i fill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.3" style="fill: var(--raised)"/><circle cx="15" cy="10" r="1.3" style="fill: var(--raised)"/><path d="M8 14c1 2.2 2.5 3 4 3s3-.8 4-3z" style="fill: var(--raised)"/></svg>
      </button>
      <button class="cbtn" id="mic" type="button" aria-label="음성">
        <svg class="i fill" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="send" id="send" type="button" aria-label="보내기" hidden>
        <svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </section>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">가입하기</h2>
      <button class="close" id="close" type="button" aria-label="닫기">×</button>
    </div>
    <p class="hint" id="hint">먼저 가입해야 로그인할 수 있어요. 닉네임은 내 정보와 서버 이름에 표시돼요.</p>
    <form id="form" novalidate>
      <div class="field" id="name-field">
        <label for="f-name">닉네임</label>
        <input id="f-name" name="name" type="text" autocomplete="nickname" maxlength="16" placeholder="2~16자">
      </div>
      <div class="field">
        <label for="f-email">아이디</label>
        <input id="f-email" name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="영어·숫자 아무거나">
      </div>
      <div class="field">
        <label for="f-pw">비밀번호</label>
        <input id="f-pw" name="password" type="password" autocomplete="current-password" placeholder="8자 이상">
      </div>
      <p class="note" id="note" role="status" aria-live="polite"></p>
      <button class="btn btn-primary" id="submit" type="submit">가입하기</button>
      <button class="switch" id="switch" type="button">이미 가입했나요? 로그인</button>
    </form>
  </div>
</main>

<script>
  (function () {
    var USERS_KEY = 'onricord.users';
    var SESSION_KEY = 'onricord.session';
    var mem = {};

    function read(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        if (raw !== null) return JSON.parse(raw);
      } catch (e) {}
      return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : fallback;
    }
    function write(key, value) {
      mem[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function remove(key) {
      delete mem[key];
      try { localStorage.removeItem(key); } catch (e) {}
    }

    function bytesToHex(bytes) {
      return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }
    function hexToBytes(hex) {
      var out = new Uint8Array(hex.length / 2);
      for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }
    function hashPassword(password, saltHex) {
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']).then(function (key) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: 100000, hash: 'SHA-256' }, key, 256);
      }).then(function (bits) { return bytesToHex(new Uint8Array(bits)); });
    }

    var $ = function (id) { return document.getElementById(id); };
    var app = $('app');
    var splash = $('splash');
    var title = $('sheet-title');
    var hint = $('hint');
    var submit = $('submit');
    var swap = $('switch');
    var nameField = $('name-field');
    var nameInput = $('f-name');
    var emailInput = $('f-email');
    var pwInput = $('f-pw');
    var note = $('note');
    var form = $('form');
    var home = $('home');
    var menu = $('menu');
    var who = $('who');
    var lastTrigger = null;
    var mode = 'signup';

    function getUsers() { return read(USERS_KEY, []); }
    function currentUser() {
      var id = read(SESSION_KEY, null);
      if (!id) return null;
      var list = getUsers();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function renderHome(user) {
      home.style.setProperty('--av', 'hsl(' + user.hue + ' 68% 44%)');
      $('who-name').textContent = user.nickname;
    }

    function enter() {
      clearTimeout(timer);
      var user = currentUser();
      if (user) {
        renderHome(user);
        app.classList.remove('is-welcome');
        app.classList.add('is-home');
      } else {
        app.classList.remove('is-home');
        app.classList.add('is-welcome');
      }
    }
    var timer = setTimeout(enter, 1900);
    splash.addEventListener('click', enter);

    function setNote(text, kind) {
      note.textContent = text || '';
      note.className = 'note' + (kind ? ' ' + kind : '');
    }
    function setMode(m) {
      mode = m;
      var signup = m === 'signup';
      title.textContent = signup ? '가입하기' : '로그인';
      submit.textContent = signup ? '가입하기' : '로그인';
      hint.textContent = signup
        ? '먼저 가입해야 로그인할 수 있어요. 닉네임은 내 정보와 서버 이름에 표시돼요.'
        : '가입한 아이디와 비밀번호로만 로그인할 수 있어요.';
      swap.textContent = signup ? '이미 가입했나요? 로그인' : '아직 가입 전이에요. 가입하기';
      nameField.hidden = !signup;
      pwInput.autocomplete = signup ? 'new-password' : 'current-password';
      setNote('');
    }
    function openSheet(m, trigger) {
      lastTrigger = trigger || null;
      setMode(m);
      app.classList.add('sheet-open');
      setTimeout(function () { (m === 'signup' ? nameInput : emailInput).focus(); }, 120);
    }
    function closeSheet(restoreFocus) {
      app.classList.remove('sheet-open');
      if (restoreFocus !== false && lastTrigger) lastTrigger.focus();
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) {
      b.addEventListener('click', function () { openSheet(b.getAttribute('data-open'), b); });
    });
    $('close').addEventListener('click', function () { closeSheet(); });
    $('backdrop').addEventListener('click', function () { closeSheet(); });
    swap.addEventListener('click', function () { setMode(mode === 'signup' ? 'login' : 'signup'); });

    function closeMenu() {
      menu.hidden = true;
      who.setAttribute('aria-expanded', 'false');
    }
    who.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;
      who.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function (e) {
      if (!menu.hidden && !menu.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (app.classList.contains('sheet-open')) closeSheet();
      else if (!menu.hidden) closeMenu();
    });
    $('logout').addEventListener('click', function () {
      closeMenu();
      remove(SESSION_KEY);
      app.classList.remove('is-chat');
      app.classList.remove('is-home');
      app.classList.add('is-welcome');
    });

    // 섹션 접기, 채널 선택
    Array.prototype.forEach.call(document.querySelectorAll('.section-head'), function (btn) {
      btn.addEventListener('click', function () {
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        $(btn.getAttribute('aria-controls')).hidden = open;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.channel'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.channel'), function (c) { c.classList.remove('active'); });
        btn.classList.add('active');
        if (btn.hasAttribute('data-chat')) openChat();
      });
    });

    // 채팅
    var MSG_KEY = 'onricord.messages';
    var feed = $('feed');
    var msgList = $('messages');
    var msgInput = $('msg');
    var sendBtn = $('send');
    var micBtn = $('mic');

    function pad(n) { return ('0' + n).slice(-2); }
    function formatTime(ts) {
      var d = new Date(ts);
      var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
      if (d.toDateString() === new Date().toDateString()) return t;
      return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + t;
    }
    function messageNode(m) {
      var row = document.createElement('div');
      row.className = 'msg';
      var av = document.createElement('span');
      av.className = 'avatar';
      av.style.setProperty('--av', 'hsl(' + m.hue + ' 68% 44%)');
      av.innerHTML = '<svg aria-hidden="true"><use href="#onri-mark"/></svg>';
      var body = document.createElement('div');
      var meta = document.createElement('div');
      meta.className = 'msg-meta';
      var name = document.createElement('b');
      name.textContent = m.nickname;
      var time = document.createElement('time');
      time.textContent = formatTime(m.ts);
      meta.appendChild(name);
      meta.appendChild(time);
      var text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = m.text;
      body.appendChild(meta);
      body.appendChild(text);
      row.appendChild(av);
      row.appendChild(body);
      return row;
    }
    function scrollFeed() { feed.scrollTop = feed.scrollHeight; }
    function renderMessages() {
      msgList.textContent = '';
      read(MSG_KEY, []).forEach(function (m) { msgList.appendChild(messageNode(m)); });
      scrollFeed();
    }
    function updateSend() {
      var has = msgInput.value.trim().length > 0;
      sendBtn.hidden = !has;
      micBtn.hidden = has;
    }
    function openChat() {
      renderMessages();
      app.classList.add('is-chat');
      setTimeout(scrollFeed, 60);
    }
    function closeChat() { app.classList.remove('is-chat'); }
    var BOTS = {
      riku: { nickname: '리쿠', hue: 205 },
      sion: { nickname: '오시온', hue: 28 }
    };
    function postBot(botId, text) {
      var bot = BOTS[botId];
      var m = {
        id: bytesToHex(crypto.getRandomValues(new Uint8Array(6))),
        userId: botId,
        nickname: bot.nickname,
        hue: bot.hue,
        text: text,
        ts: Date.now()
      };
      var list = read(MSG_KEY, []);
      list.push(m);
      write(MSG_KEY, list.slice(-200));
      msgList.appendChild(messageNode(m));
      scrollFeed();
    }
    function sendMessage() {
      var text = msgInput.value.trim().slice(0, 2000);
      var user = currentUser();
      if (!text || !user) return;
      var list = read(MSG_KEY, []);
      var isFirst = !list.some(function (x) { return x.userId === user.id; });
      var rikuAsked = list.some(function (x) { return x.userId === 'riku' && x.text === '시온이 형이 초대했어요?'; });
      var sionSpoke = list.some(function (x) { return x.userId === 'sion'; });
      var m = {
        id: bytesToHex(crypto.getRandomValues(new Uint8Array(6))),
        userId: user.id,
        nickname: user.nickname,
        hue: user.hue,
        text: text,
        ts: Date.now()
      };
      list.push(m);
      write(MSG_KEY, list.slice(-200));
      msgList.appendChild(messageNode(m));
      msgInput.value = '';
      updateSend();
      scrollFeed();
      msgInput.focus();
      if (isFirst) {
        setTimeout(function () {
          postBot('riku', '안뇽하세요');
          setTimeout(function () { postBot('riku', '시온이 형이 초대했어요?'); }, 1000);
        }, 900);
      } else if (rikuAsked && !sionSpoke) {
        setTimeout(function () { postBot('sion', '오 뭐야 들어 왔네 ㅋㅋㅋ'); }, 1000);
      }
    }
    $('chat-back').addEventListener('click', closeChat);
    msgInput.addEventListener('input', updateSend);
    msgInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    function validEmail(v) { return /^[A-Za-z0-9@._-]+$/.test(v); }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!(window.crypto && crypto.subtle)) {
        setNote('이 브라우저에서는 가입과 로그인을 쓸 수 없어요. 최신 브라우저에서 열어 주세요.', 'err');
        return;
      }
      var email = emailInput.value.trim().toLowerCase();
      var password = pwInput.value;
      var users = getUsers();
      var found = null;
      for (var i = 0; i < users.length; i++) if (users[i].email === email) found = users[i];

      if (mode === 'signup') {
        var nickname = nameInput.value.trim();
        var len = Array.from(nickname).length;
        if (len < 2 || len > 16) return setNote('닉네임은 2자에서 16자 사이로 입력해 주세요.', 'err');
        if (!validEmail(email)) return setNote('아이디는 영어와 숫자로 입력해 주세요.', 'err');
        if (password.length < 8) return setNote('비밀번호는 8자 이상이어야 해요.', 'err');
        if (found) return setNote('이미 가입된 아이디예요. 로그인해 주세요.', 'err');

        submit.disabled = true;
        var saltBytes = crypto.getRandomValues(new Uint8Array(16));
        var salt = bytesToHex(saltBytes);
        hashPassword(password, salt).then(function (hash) {
          var list = getUsers();
          list.push({
            id: bytesToHex(crypto.getRandomValues(new Uint8Array(8))),
            nickname: nickname,
            email: email,
            salt: salt,
            hash: hash,
            hue: Math.floor(Math.random() * 360),
            createdAt: Date.now()
          });
          write(USERS_KEY, list);
          setMode('login');
          emailInput.value = email;
          pwInput.value = '';
          setNote('가입이 완료됐어요. 이제 로그인해 주세요.', 'ok');
          pwInput.focus();
        }).catch(function () {
          setNote('가입 중 문제가 생겼어요. 잠시 뒤에 다시 시도해 주세요.', 'err');
        }).then(function () { submit.disabled = false; });
        return;
      }

      if (!validEmail(email)) return setNote('아이디는 영어와 숫자로 입력해 주세요.', 'err');
      if (!found) return setNote('가입되지 않은 아이디예요. 먼저 가입해 주세요.', 'err');
      if (!password) return setNote('비밀번호를 입력해 주세요.', 'err');

      submit.disabled = true;
      hashPassword(password, found.salt).then(function (hash) {
        if (hash !== found.hash) { setNote('비밀번호가 맞지 않아요.', 'err'); return; }
        write(SESSION_KEY, found.id);
        form.reset();
        closeSheet(false);
        renderHome(found);
        app.classList.remove('is-welcome');
        app.classList.add('is-home');
      }).catch(function () {
        setNote('로그인 중 문제가 생겼어요. 잠시 뒤에 다시 시도해 주세요.', 'err');
      }).then(function () { submit.disabled = false; });
    });
  })();
</script>
</body>
</html>
